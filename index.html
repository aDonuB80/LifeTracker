<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lifetrack">
<meta name="format-detection" content="telephone=no">
<title>Lifetrack</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main id="main"><p style="text-align:center;color:#8d95a5;margin-top:40vh">Lade …</p></main>
<nav class="tabbar" aria-label="Hauptnavigation"></nav>
<button id="fab" aria-label="Eintragen">+</button>
<div id="timer" role="timer"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="sheets"></div>
<script>
  // Tastatur-Höhe für Bottom-Sheets (iOS verschiebt sonst Inhalte hinter die Tastatur)
  (function () {
    var vv = window.visualViewport; if (!vv) return;
    function upd() { document.documentElement.style.setProperty('--kb', Math.max(0, window.innerHeight - vv.height - vv.offsetTop) + 'px'); }
    vv.addEventListener('resize', upd); vv.addEventListener('scroll', upd);
  })();
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
